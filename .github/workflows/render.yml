name: HyperFrames six-second render
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HYPERFRAMES_SKIP_SKILLS: '1'
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Prepare browser and pinned dependencies
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm install --no-audit --no-fund --no-save hyperframes@0.9.7 gsap@3.15.0
          if ! command -v google-chrome; then
            node_modules/.bin/hyperframes browser ensure
          fi
          browser=$(command -v google-chrome || node_modules/.bin/hyperframes browser path)
          test -x "$browser"
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
          mkdir -p assets
          cp node_modules/gsap/dist/gsap.min.js assets/
          sha256sum --check gsap.sha256
          node_modules/.bin/hyperframes --version
      - name: Time the render
        run: |
          set -o pipefail
          /usr/bin/time -f 'Render wall time: %e s' node_modules/.bin/hyperframes render --quality draft -o GitHub-test.mp4 . 2>&1 | tee render.log
      - name: Decode and verify the MP4
        run: |
          test -s GitHub-test.mp4
          ffmpeg -nostdin -v error -xerror -i GitHub-test.mp4 -map 0:v:0 -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=codec_name,width,height,nb_read_frames,r_frame_rate:format=duration -of json GitHub-test.mp4 | tee video.json
          jq -e '.streams[0] | .codec_name == "h264" and .width == 1920 and .height == 1080 and .nb_read_frames == "180" and .r_frame_rate == "30/1"' video.json
          jq -e '.format.duration | tonumber == 6' video.json
          cat video.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: HyperFrames-GitHub-test
          path: |
            GitHub-test.mp4
            video.json
            render.log
          if-no-files-found: error
          retention-days: 1
